<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>My English · 通往自由职业与芬兰</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#22304A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My English">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg:#F5F3ED;
    --bg-card:#FFFFFF;
    --ink:#1C2230;
    --ink-soft:#5B6270;
    --navy:#22304A;
    --navy-dark:#161E30;
    --mist:#8492A6;
    --aurora:#3E8FB0;
    --gold:#C99A3E;
    --berry:#B65C6E;
    --line:#DEDACD;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;
    min-height:100vh; -webkit-font-smoothing:antialiased; touch-action:manipulation;
  }
  #app{max-width:720px; margin:0 auto; padding:28px 18px 90px;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* ---- 头部卡片 ---- */
  .pass{
    background:var(--navy-dark); color:#F1F3F7; border-radius:18px; padding:22px 22px 18px;
    position:relative; overflow:hidden; box-shadow:0 12px 30px -14px rgba(22,30,48,.55);
  }
  .pass::before{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(60% 90% at 15% -10%, rgba(62,143,176,.35), transparent 60%),
      radial-gradient(50% 80% at 110% 10%, rgba(201,154,62,.22), transparent 60%);
    animation:aurora 14s ease-in-out infinite alternate;
  }
  @media (prefers-reduced-motion: reduce){ .pass::before{animation:none;} }
  @keyframes aurora{ from{opacity:.6;} to{opacity:1; transform:translateY(8px);} }
  .pass-row{position:relative; display:flex; justify-content:space-between; align-items:flex-start; gap:14px;}
  .eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#9FB0C6;}
  .phase-label{font-family:'Space Grotesk'; font-weight:600; font-size:19px; margin-top:6px;}
  .code{font-family:'IBM Plex Mono'; font-weight:600; font-size:12.5px; color:#AAB8CC; margin-top:4px;}
  .countdown{position:relative; text-align:right;}
  .countdown .num{font-family:'IBM Plex Mono'; font-size:30px; font-weight:600; line-height:1; color:#fff;}
  .countdown .lbl{font-size:10.5px; color:#9FB0C6; margin-top:4px; max-width:120px;}
  .perforation{position:relative; margin-top:18px; height:1px; border-top:2px dashed rgba(241,243,247,.25);}
  .perforation::before,.perforation::after{content:""; position:absolute; top:-9px; width:18px; height:18px; border-radius:50%; background:var(--bg);}
  .perforation::before{left:-32px;} .perforation::after{right:-32px;}
  .progress-row{position:relative; display:flex; align-items:center; gap:12px; margin-top:16px; font-size:12px; color:#AAB8CC;}
  .progress-bar{flex:1; height:6px; background:rgba(241,243,247,.16); border-radius:99px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--aurora); border-radius:99px; transition:width .4s ease;}

  .theme-card{
    background:var(--bg-card); border:1.5px dashed var(--line); border-radius:16px; padding:16px 18px; margin-top:20px;
  }
  .theme-card .lbl{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); font-weight:600;}
  .theme-card h2{font-size:18px; margin-top:6px;}

  .section-title{margin:28px 0 12px; font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; display:flex; align-items:center; gap:8px;}

  /* ---- 词汇卡片 ---- */
  .vocab-card{
    background:linear-gradient(135deg,#FBF3E1,#F6E7C8); border:1px solid #E7D19C; border-radius:14px;
    padding:14px 16px; margin-bottom:10px;
  }
  .vocab-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .vocab-word{font-family:'Space Grotesk'; font-weight:700; font-size:18px; color:var(--navy-dark);}
  .vocab-stress{font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--gold); margin-top:3px;}
  .vocab-zh{font-size:13px; color:var(--ink-soft); margin-top:6px;}
  .vocab-example{font-size:13px; color:var(--ink); margin-top:6px; font-style:italic; line-height:1.5;}

  /* ---- 对话 ---- */
  .log{display:flex; flex-direction:column; gap:12px;}
  .bubble{max-width:86%; padding:12px 14px; border-radius:14px; font-size:15px; line-height:1.6; animation:rise .2s ease;}
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .bubble.npc{background:var(--bg-card); border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:4px;}
  .bubble.npc .who{font-size:11px; color:var(--navy); font-weight:600; margin-bottom:2px; font-family:'Space Grotesk';}
  .bubble.user{background:var(--navy); color:#F1F3F7; align-self:flex-end; border-bottom-right-radius:4px;}
  .bubble.tip{align-self:flex-end; background:transparent; border:1px dashed var(--aurora); color:var(--navy-dark); font-size:13px; max-width:82%;}
  .bubble.tip .lbl{color:var(--aurora); font-weight:600; margin-right:4px; font-family:'Space Grotesk'; font-size:12px;}
  .row-line{display:flex; align-items:center; justify-content:space-between; gap:8px;}

  .choices{display:flex; flex-direction:column; gap:10px; margin-top:16px;}
  .choice-btn{
    text-align:left; background:var(--bg-card); border:1.5px solid var(--line); border-radius:14px;
    padding:14px 16px; font-size:15px; color:var(--ink); cursor:pointer; font-family:'Inter';
    min-height:55px; display:flex; align-items:center; justify-content:space-between; gap:10px;
    transition:border-color .15s ease, background .15s ease;
  }
  .choice-btn:active{background:#EEF1F5; border-color:var(--navy);}
  .choice-btn .txt{flex:1;}

  .continue-row{display:flex; justify-content:center; margin-top:20px;}
  .btn-primary{
    background:var(--navy); color:#fff; border:none; border-radius:99px; padding:13px 30px;
    font-family:'Space Grotesk'; font-weight:600; font-size:16px; cursor:pointer; min-height:50px;
  }
  .btn-primary:active{transform:scale(0.96);}

  /* ---- 语法 ---- */
  .grammar-card{background:var(--bg-card); border:1.5px solid var(--line); border-radius:16px; padding:18px;}
  .grammar-card .point{font-family:'Space Grotesk'; font-weight:700; font-size:16px; color:var(--navy);}
  .grammar-card .explain{font-size:13.5px; color:var(--ink); margin-top:8px; line-height:1.6;}
  .grammar-card .example{font-size:13px; color:var(--ink-soft); margin-top:8px; padding-left:10px; border-left:2px solid var(--aurora); line-height:1.5;}

  /* ---- 跟读 ---- */
  .read-card{
    background:var(--bg-card); border:1.5px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px;
  }
  .read-top{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .read-text{font-size:15px; font-weight:600; color:var(--ink); line-height:1.5;}
  .read-chunks{font-family:'IBM Plex Mono'; font-size:12px; color:var(--aurora); margin-top:6px;}
  .read-check{
    display:flex; align-items:center; gap:8px; margin-top:10px; font-size:12.5px; color:var(--ink-soft); cursor:pointer;
  }
  .read-check input{width:18px; height:18px;}

  /* ---- 语音按钮 ---- */
  .speak-btn{
    display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%;
    border:none; cursor:pointer; background:rgba(0,0,0,.06); color:inherit; font-size:13px; flex-shrink:0;
    transition:background .15s ease, transform .1s ease;
  }
  .speak-btn:active{transform:scale(0.88); background:rgba(0,0,0,.15);}
  .speak-btn.playing{background:var(--aurora); color:#fff;}
  .bubble.user .speak-btn{background:rgba(255,255,255,.18); color:#fff;}

  .footnote{margin-top:26px; font-size:12px; color:var(--ink-soft); line-height:1.6; text-align:center;}
  .toast-update{text-align:center; font-size:12px; color:var(--aurora); padding:6px 0; animation:fadeInOut 3s forwards;}
  @keyframes fadeInOut{ 0%{opacity:0;} 20%{opacity:1;} 80%{opacity:1;} 100%{opacity:0;} }

  .complete-card{
    text-align:center; margin-top:20px; background:var(--bg-card); border:1.5px dashed var(--navy);
    border-radius:16px; padding:26px 20px;
  }
  .complete-card h3{font-size:17px; margin-bottom:6px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------- 保底内容（AI没配好或今天生成失败时用） ---------------- */
const FALLBACK_DAY = {
  theme:'跟同事解释一个数据指标',
  phase_label:'阶段一 · SaaS数据分析基础',
  vocab:[
    {word:'metric', stress_zh:'MET-rik（重音第一个音节）', zh:'指标', example:"This is the key metric we track every week."},
    {word:'churn rate', stress_zh:'CHURN reit（churn 重读）', zh:'流失率', example:"Our churn rate went down this month."},
    {word:'retention', stress_zh:'ri-TEN-shən（重音第二个音节）', zh:'留存(率)', example:"User retention improved after the update."},
    {word:'cohort', stress_zh:'KOH-hort（重音第一个音节）', zh:'分组/群组', example:"Let's look at this cohort of new users."},
    {word:'trend', stress_zh:'trend（一个音节，短促）', zh:'趋势', example:"The trend is going up steadily."},
    {word:'insight', stress_zh:'IN-sait（重音第一个音节）', zh:'洞察/发现', example:"This chart gives us a useful insight."}
  ],
  dialogue:[
    {type:'npc', name:'同事 Anna', text:"Hey, can you walk me through this chart real quick?"},
    {type:'choice', options:[
      {text:"Sure! So this metric shows our churn rate.", tip:'直接点明是什么指标，简洁清楚'},
      {text:"Yeah, of course. Let me explain the trend here.", tip:'先答应，再引导对方看趋势，很自然'}
    ]},
    {type:'npc', name:'同事 Anna', text:"Oh interesting, so it's going down. That's good, right?"},
    {type:'choice', options:[
      {text:"Exactly! Retention is improving too.", tip:'用 exactly 确认对方理解正确，很地道'},
      {text:"Right, and this cohort is doing even better.", tip:'补充细节，展示你懂数据背后的分组'}
    ]},
    {type:'npc', name:'同事 Anna', text:"Got it, thanks for the insight!"}
  ],
  grammar:{
    point:'用 -ing 形式做主语补充说明（现在分词短语）',
    explain:'像 "focusing on..." 这种 -ing 开头的短语，可以补充说明前面那个人在做什么，不用重复说 who/that。日常口语里超常见，能让句子更简洁自然。',
    examples:["I'm a data analyst focusing on SaaS data.", "She's the one handling the churn report."]
  },
  read_aloud:[
    {text:"I'm a data analyst focusing on SaaS and e-commerce data.", chunks:"I'm a data analyst / focusing on / SaaS and e-commerce data."},
    {text:"This metric shows our churn rate is going down.", chunks:"This metric shows / our churn rate / is going down."},
    {text:"Let's look at this cohort of new users.", chunks:"Let's look at / this cohort / of new users."}
  ]
};

/* ---------------- 配置 ---------------- */
const WORKER_URL = "https://tampere-daily.bonicoxu.workers.dev";
const STORAGE_KEY = 'myenglish-progress';

/* ---------------- 状态 ---------------- */
const State = {
  view:'home',
  dayData:null,
  dayKey:null,
  dayNumber:1,
  daySource:'fallback',
  lastGenError:null,
  _refreshing:false,
  revealed:0,
  chosen:{},
  readDone:{},           // { '2026-08-15': [0,1,2] } 今天勾了哪几句跟读
  completedDates:[],     // 标记为"今日完成"的日期，用来算连续打卡
  vocabBank:{},          // 累积词库 { word: {word,zh,example,stress_zh,status,reviewCount,firstSeen} }
  reviewQueue:[],
  reviewIndex:0,
  reviewFlipped:false
};

function todayKey(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dayDiff(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000); }

function getPhase(){
  const now = new Date();
  if(now < new Date('2027-01-01')) return 'phase1';
  if(now < new Date('2029-01-01')) return 'phase2';
  return 'phase3';
}
function getPhaseLabel(){
  const p = getPhase();
  if(p==='phase1') return '阶段一 · SaaS数据分析基础';
  if(p==='phase2') return '阶段二 · 自由职业与商务沟通';
  return '阶段三 · 芬兰创业圈开发';
}
function getMilestone(){
  const p = getPhase();
  if(p==='phase1') return { label:'距离启动接单阶段', target:new Date('2027-01-01') };
  if(p==='phase2') return { label:'距离深耕芬兰阶段', target:new Date('2029-01-01') };
  return { label:'芬兰创业圈进行中', target:null };
}

/* ---------------- 语音 ---------------- */
let cachedVoices = [];
function loadVoices(){
  cachedVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  if(window.speechSynthesis){ window.speechSynthesis.onvoiceschanged = () => { cachedVoices = window.speechSynthesis.getVoices(); }; }
}
function escJs(str){ return String(str).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function speak(btn, text, lang){
  if(!('speechSynthesis' in window)){ alert('浏览器不支持语音，请用 Chrome / Safari'); return; }
  window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn.playing').forEach(b=>b.classList.remove('playing'));
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang || 'en-US';
  utter.rate = 0.85;
  const voices = cachedVoices.length ? cachedVoices : window.speechSynthesis.getVoices();
  const chosen = voices.find(v => v.lang === 'en-GB' && v.name.includes('Google')) ||
                 voices.find(v => v.lang === 'en-US' && v.name === 'Samantha') ||
                 voices.find(v => v.lang.startsWith('en') && !v.name.includes('Microsoft')) ||
                 voices.find(v => v.lang.startsWith('en'));
  if(chosen) utter.voice = chosen;
  btn.classList.add('playing');
  utter.onend = () => btn.classList.remove('playing');
  utter.onerror = () => btn.classList.remove('playing');
  window.speechSynthesis.speak(utter);
}

/* ---------------- 存储 ---------------- */
function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      readDone: State.readDone, completedDates: State.completedDates
    }));
  }catch(e){}
}
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function resetProgress(){
  if(!confirm('确定清空所有打卡记录吗？')) return;
  State.readDone = {}; State.completedDates = [];
  saveProgress(); render();
}

/* ---------------- 复习词库 ---------------- */
function loadVocabBank(){
  try{ const raw = localStorage.getItem('myenglish-vocab-bank'); return raw ? JSON.parse(raw) : {}; }
  catch(e){ return {}; }
}
function saveVocabBank(){
  try{ localStorage.setItem('myenglish-vocab-bank', JSON.stringify(State.vocabBank)); }catch(e){}
}
function mergeVocabIntoBank(vocabList, dateKey){
  (vocabList||[]).forEach(v=>{
    const key = (v.word||'').trim().toLowerCase();
    if(!key) return;
    if(!State.vocabBank[key]){
      State.vocabBank[key] = {
        word: v.word, zh: v.zh, example: v.example, stress_zh: v.stress_zh,
        status:'new', reviewCount:0, firstSeen: dateKey
      };
    }
  });
  saveVocabBank();
}
function shuffleArr(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }

function startReview(){
  const words = Object.values(State.vocabBank);
  if(!words.length){ alert('还没攒够词呢，先学几天再来复习～'); return; }
  const learning = words.filter(w=>w.status!=='known');
  const known = words.filter(w=>w.status==='known');
  State.reviewQueue = [...shuffleArr(learning), ...shuffleArr(known)];
  State.reviewIndex = 0;
  State.reviewFlipped = false;
  State.view = 'review';
  render();
}
function flipCard(){ State.reviewFlipped = !State.reviewFlipped; render(); }
function markWord(status){
  const cur = State.reviewQueue[State.reviewIndex];
  const key = (cur.word||'').trim().toLowerCase();
  if(State.vocabBank[key]){ State.vocabBank[key].status = status; State.vocabBank[key].reviewCount++; }
  saveVocabBank();
  State.reviewIndex++;
  State.reviewFlipped = false;
  render();
}

/* ---------------- 每日内容：缓存优先 + 后台更新 ---------------- */
async function ensureStartDate(){
  const today = todayKey();
  try{
    let start = localStorage.getItem('myenglish-startdate');
    if(!start){ start = today; localStorage.setItem('myenglish-startdate', start); }
    State.dayNumber = dayDiff(start, today) + 1;
  }catch(e){ State.dayNumber = 1; }
}

function fetchWithTimeout(url, options, timeout=7000){
  return Promise.race([
    fetch(url, options),
    new Promise((_,reject)=>setTimeout(()=>reject(new Error('请求超时')), timeout))
  ]);
}

async function generateDayViaAI(dateKey){
  State.lastGenError = null;
  if(!WORKER_URL || WORKER_URL.includes('在这里')){ State.lastGenError = 'WORKER_URL 没配置'; return null; }
  try{
    const resp = await fetchWithTimeout(WORKER_URL, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ app:'mom', dateKey, dayNumber: State.dayNumber, phase: getPhaseLabel() })
    }, 8000);
    const raw = await resp.text();
    if(!resp.ok){ State.lastGenError = `Worker错误(${resp.status})：${raw.slice(0,300)}`; return null; }
    const clean = raw.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    if(parsed && Array.isArray(parsed.vocab) && Array.isArray(parsed.dialogue)) return parsed;
    State.lastGenError = '返回格式不对：' + clean.slice(0,300);
    return null;
  }catch(e){
    State.lastGenError = String(e);
    return null;
  }
}

function applyNewDay(dateKey, data, source){
  State.dayData = data;
  State.dayKey = dateKey;
  State.daySource = source || 'fallback';
  mergeVocabIntoBank(data.vocab, dateKey);
  try{
    localStorage.setItem('myenglish-day-' + dateKey, JSON.stringify(data));
    localStorage.setItem('myenglish-day-source-' + dateKey, source);
  }catch(e){}
  if(State.view === 'home') render();
}

async function ensureDailyContent(){
  const dateKey = todayKey();
  if(State.dayKey === dateKey && State.dayData) return;

  let cached = null, cachedSource = null;
  try{
    const raw = localStorage.getItem('myenglish-day-' + dateKey);
    const rawSource = localStorage.getItem('myenglish-day-source-' + dateKey);
    if(raw){ cached = JSON.parse(raw); cachedSource = rawSource || null; }
  }catch(e){}

  if(cached){
    State.dayData = cached; State.dayKey = dateKey; State.daySource = cachedSource || 'fallback';
    await ensureStartDate();
    mergeVocabIntoBank(cached.vocab, dateKey);
    render();
    if(cachedSource === 'fallback' || !cachedSource){ setTimeout(()=>refreshInBackground(dateKey), 1500); }
    return;
  }

  State.dayData = FALLBACK_DAY; State.dayKey = dateKey; State.daySource = 'fallback';
  await ensureStartDate();
  mergeVocabIntoBank(FALLBACK_DAY.vocab, dateKey);
  render();
  setTimeout(()=>refreshInBackground(dateKey), 500);
}

async function refreshInBackground(dateKey){
  if(State._refreshing) return;
  State._refreshing = true;
  if(State.view === 'home') render();
  try{
    const data = await generateDayViaAI(dateKey);
    if(data){ applyNewDay(dateKey, data, 'ai'); }
  }catch(e){ console.warn('后台更新失败', e); }
  State._refreshing = false;
  if(State.view === 'home') render();
}

async function forceRefreshNow(){
  const dateKey = todayKey();
  try{ localStorage.removeItem('myenglish-day-' + dateKey); }catch(e){}
  try{ localStorage.removeItem('myenglish-day-source-' + dateKey); }catch(e){}
  State.dayData = null; State.dayKey = null;
  await ensureDailyContent();
}

/* ---------------- 渲染 ---------------- */
function toggleRead(idx){
  const key = State.dayKey;
  const set = new Set(State.readDone[key] || []);
  if(set.has(idx)) set.delete(idx); else set.add(idx);
  State.readDone[key] = [...set];
  if(!State.completedDates.includes(key) && State.dayData && set.size >= State.dayData.read_aloud.length){
    State.completedDates.push(key);
  }
  saveProgress();
  render();
}

function renderHome(){
  const d = State.dayData || FALLBACK_DAY;
  const readSet = new Set(State.readDone[State.dayKey] || []);
  const milestone = getMilestone();
  const daysLeft = milestone.target ? Math.max(0, Math.ceil((milestone.target - new Date())/86400000)) : null;

  let toastHtml = State._refreshing ? '<div class="toast-update">🔄 正在后台更新今天的内容…</div>' : '';
  if(State.daySource === 'fallback' && !State._refreshing && State.dayData){
    toastHtml = `<div class="toast-update" style="color:var(--berry);">📡 今天暂时用的是备用内容<span style="text-decoration:underline;cursor:pointer;margin-left:6px;" onclick="forceRefreshNow()">点此重试</span></div>`;
  }

  const vocabHtml = (d.vocab||[]).map(v => `
    <div class="vocab-card">
      <div class="vocab-top">
        <div>
          <div class="vocab-word">${v.word}</div>
          <div class="vocab-stress">${v.stress_zh||''}</div>
        </div>
        <button class="speak-btn" onclick="speak(this,'${escJs(v.word)}','en-US')">🔊</button>
      </div>
      <div class="vocab-zh">${v.zh||''}</div>
      <div class="vocab-example">${v.example||''}</div>
    </div>
  `).join('');

  const readHtml = (d.read_aloud||[]).map((r,i) => `
    <div class="read-card">
      <div class="read-top">
        <div class="read-text">${r.text}</div>
        <button class="speak-btn" onclick="speak(this,'${escJs(r.text)}','en-US')">🔊</button>
      </div>
      <div class="read-chunks">${r.chunks||''}</div>
      <label class="read-check">
        <input type="checkbox" ${readSet.has(i)?'checked':''} onchange="toggleRead(${i})">
        我读出声了
      </label>
    </div>
  `).join('');

  const doneCount = readSet.size;
  const totalRead = (d.read_aloud||[]).length;
  const pct = totalRead ? Math.round((doneCount/totalRead)*100) : 0;

  return `
    <div class="pass">
      <div class="pass-row">
        <div>
          <div class="eyebrow">My English Journey</div>
          <div class="phase-label">${getPhaseLabel()}</div>
          <div class="code">DAY ${State.dayNumber} · ${State.dayKey}</div>
        </div>
        ${daysLeft !== null ? `
          <div class="countdown">
            <div class="num">${daysLeft}</div>
            <div class="lbl">${milestone.label}还有（天）</div>
          </div>
        ` : ''}
      </div>
      <div class="perforation"></div>
      <div class="progress-row">
        <span>今日跟读 ${doneCount}/${totalRead}</span>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <span>${pct}%</span>
      </div>
    </div>
    ${toastHtml}

    <div class="theme-card">
      <div class="lbl">今日主题</div>
      <h2>${d.theme||''}</h2>
    </div>

    <div class="continue-row" style="margin-top:16px;">
      <button class="btn-primary" style="background:var(--gold);" onclick="startReview()">🔁 复习词库（共 ${Object.keys(State.vocabBank).length} 词）</button>
    </div>

    <div class="section-title">📚 今日新词</div>
    ${vocabHtml}

    <div class="section-title">💬 情景对话</div>
    <div class="continue-row"><button class="btn-primary" onclick="startDialogue()">开始今天的对话练习</button></div>

    <div class="section-title" style="margin-top:28px;">📝 语法点</div>
    <div class="grammar-card">
      <div class="point">${d.grammar?.point||''}</div>
      <div class="explain">${d.grammar?.explain||''}</div>
      ${(d.grammar?.examples||[]).map(ex=>`<div class="example">${ex}</div>`).join('')}
    </div>

    <div class="section-title">🗣️ 跟读练习（张嘴读出声！）</div>
    ${readHtml}

    <div class="footnote">
      每天内容自动更新，跟读是专门练"开口"的部分，别只用眼睛看<br>
      <span style="text-decoration:underline; cursor:pointer;" onclick="resetProgress()">清空打卡记录</span>
    </div>
  `;
}

function startDialogue(){
  State.view = 'dialogue';
  State.revealed = 0;
  State.chosen = {};
  render();
}
function goHome(){ State.view = 'home'; render(); }

function renderLogEntry(step, chosenIndex){
  if(step.type === 'npc'){
    const txt = step.text;
    return `<div class="bubble npc"><div class="who">${step.name}</div>
      <div class="row-line"><span>${txt}</span><button class="speak-btn" onclick="speak(this,'${escJs(txt)}','en-US')">🔊</button></div>
    </div>`;
  }
  if(step.type === 'choice'){
    const opt = step.options[chosenIndex];
    let html = `<div class="bubble user"><div class="row-line"><span>${opt.text}</span><button class="speak-btn" onclick="speak(this,'${escJs(opt.text)}','en-US')">🔊</button></div></div>`;
    if(opt.tip){ html += `<div class="bubble tip"><span class="lbl">💬 小提示</span>${opt.tip}</div>`; }
    return html;
  }
  return '';
}

function renderDialogue(){
  const d = State.dayData || FALLBACK_DAY;
  const steps = d.dialogue || [];
  const logHtml = steps.slice(0, State.revealed).map((s,i)=>renderLogEntry(s, State.chosen[i])).join('');

  let bottomHtml = '';
  if(State.revealed >= steps.length){
    bottomHtml = `
      <div class="complete-card">
        <h3>对话练习完成！🎉</h3>
        <div style="font-size:13px;color:var(--ink-soft)">回护照页继续做跟读练习吧</div>
        <div class="continue-row"><button class="btn-primary" onclick="goHome()">返回首页</button></div>
      </div>`;
  } else {
    const next = steps[State.revealed];
    if(next.type === 'choice'){
      bottomHtml = `<div class="choices">
        ${next.options.map((o,i)=>`<button class="choice-btn" onclick="chooseOption(${i})"><span class="txt">${o.text}</span><span class="speak-btn" onclick="event.stopPropagation(); speak(this,'${escJs(o.text)}','en-US')">🔊</span></button>`).join('')}
      </div>`;
    } else {
      bottomHtml = `<div class="continue-row"><button class="btn-primary" onclick="advance()">继续 →</button></div>`;
    }
  }

  return `
    <div class="scene-header" style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
      <button class="back-btn" onclick="goHome()" style="background:none; border:1.5px solid var(--line); border-radius:99px; width:40px; height:40px; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;">←</button>
      <div><h2 style="font-size:18px;">${d.theme||''}</h2></div>
    </div>
    <div class="log">${logHtml}</div>
    ${bottomHtml}
  `;
}

function advance(){ State.revealed++; render(); }
function chooseOption(i){ State.chosen[State.revealed]=i; State.revealed++; render(); }

function renderReview(){
  const total = State.reviewQueue.length;
  if(State.reviewIndex >= total){
    const knownCount = State.reviewQueue.filter(w=>{
      const k=(w.word||'').trim().toLowerCase();
      return State.vocabBank[k] && State.vocabBank[k].status==='known';
    }).length;
    return `
      <div class="scene-header" style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
        <button class="back-btn" onclick="goHome()" style="background:none; border:1.5px solid var(--line); border-radius:99px; width:40px; height:40px; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;">←</button>
        <div><h2 style="font-size:18px;">复习完成</h2></div>
      </div>
      <div class="complete-card">
        <h3>这一轮复习完成了！🎉</h3>
        <div style="font-size:13px;color:var(--ink-soft)">这次复习了 ${total} 个词，其中 ${knownCount} 个标记为"已记住"</div>
        <div class="continue-row"><button class="btn-primary" onclick="goHome()">返回首页</button></div>
      </div>`;
  }

  const w = State.reviewQueue[State.reviewIndex];
  return `
    <div class="scene-header" style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
      <button class="back-btn" onclick="goHome()" style="background:none; border:1.5px solid var(--line); border-radius:99px; width:40px; height:40px; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;">←</button>
      <div><h2 style="font-size:18px;">复习中</h2><div class="mono" style="font-size:12px;color:var(--ink-soft);">第 ${State.reviewIndex+1} / ${total} 个</div></div>
    </div>
    <div class="vocab-card" style="min-height:180px; display:flex; flex-direction:column; justify-content:center; cursor:pointer;" onclick="flipCard()">
      <div class="vocab-top">
        <div class="vocab-word" style="font-size:24px;">${w.word}</div>
        <button class="speak-btn" onclick="event.stopPropagation(); speak(this,'${escJs(w.word)}','en-US')">🔊</button>
      </div>
      ${!State.reviewFlipped ? `
        <div style="margin-top:14px; font-size:13px; color:var(--ink-soft);">点卡片翻面看意思 👆</div>
      ` : `
        <div class="vocab-zh" style="font-size:16px; margin-top:10px;">${w.zh||''}</div>
        <div class="vocab-example" style="margin-top:8px;">${w.example||''}</div>
      `}
    </div>
    ${State.reviewFlipped ? `
      <div class="choices">
        <button class="choice-btn" style="border-color:var(--berry);" onclick="markWord('learning')"><span class="txt">😅 还没记住</span></button>
        <button class="choice-btn" style="border-color:var(--aurora);" onclick="markWord('known')"><span class="txt">✅ 已经记住</span></button>
      </div>
    ` : ''}
  `;
}

function render(){
  if(State.view === 'home') document.getElementById('app').innerHTML = renderHome();
  else if(State.view === 'review') document.getElementById('app').innerHTML = renderReview();
  else document.getElementById('app').innerHTML = renderDialogue();
}

/* ---------------- 启动 ---------------- */
async function init(){
  const saved = loadProgress();
  if(saved){ State.readDone = saved.readDone || {}; State.completedDates = saved.completedDates || []; }
  State.vocabBank = loadVocabBank();
  loadVoices();
  await ensureDailyContent();
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(e => console.warn('SW注册失败', e));
    });
  }
}
init();
</script>
</body>
</html>
